[fp-turret-filler]
button-tooltip=Ładowanie turretów — postawiony przez Ciebie turret automatycznie dostaje amunicję z Twojego ekwipunku. Kliknij, aby wybrać amunicję i ilość albo wyłączyć tę funkcję dla siebie.
window-title=Ładowanie turretów
close=Zamknij
description=Gdy stawiasz turret na amunicję, amunicja trafia do niego z Twojego ekwipunku. Działa też, gdy robot buduje Twojego ghosta, a Ty stoisz nie dalej niż 40 kafli.
enable-caption=Ładuj turrety, które stawiam
enable-tooltip=Odznaczenie wyłącza ładowanie tylko Tobie. O dostępności całej funkcji decyduje administrator serwera.
ammo-caption=Amunicja
ammo-tooltip=Amunicja wkładana do turreta. Kliknij, aby wybrać inną; prawy przycisk myszy przywraca domyślną. Turret, który nie obsługuje wybranej amunicji (np. naboje w wyrzutni rakiet), zostaje pusty.
amount-caption=Ilość
amount-tooltip=Ile sztuk trafia do każdego turreta (1–100). Jeśli masz mniej, oddajesz tyle, ile masz; turret nie przyjmie więcej, niż się w nim mieści.
lower-caption=Użyj słabszej amunicji, gdy zabraknie wybranej
lower-tooltip=Gdy nie masz wybranej amunicji, użyta zostanie kolejna słabsza tego samego rodzaju (np. magazynki uranowe → przeciwpancerne → zwykłe).
no-ammo-available=Brak dostępnej amunicji do turretów
