[fp-turret-filler]
button-tooltip=Turret filler — a turret you build gets ammo from your inventory automatically. Click to choose the ammo and amount, or to turn it off for yourself.
window-title=Turret filler
close=Close
description=When you build an ammo turret, ammo is moved into it from your inventory. It also works when a robot builds your ghost while you stand within 40 tiles.
enable-caption=Fill the turrets I build
enable-tooltip=Unchecking turns the filler off only for you. The server admin controls whether the feature is available at all.
ammo-caption=Ammo
ammo-tooltip=Ammo moved into the turret. Click to pick another one; right-click restores the default. A turret that cannot use the chosen ammo (e.g. bullets in a rocket turret) is left empty.
amount-caption=Amount
amount-tooltip=How many pieces go into each turret (1–100). If you have fewer, you give what you have; the turret takes no more than fits.
lower-caption=Use lower-tier ammo when I run out
lower-tooltip=When you have none of the chosen ammo, the next weaker ammo of the same kind is used instead (e.g. uranium → piercing → firearm magazines).
no-ammo-available=No turret ammo available
