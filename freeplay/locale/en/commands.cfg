[fp-commands]
trust-help=<player> - Mark player as trusted (admin-only)
untrust-help=<player> - Revoke player trusted status (admin-only)
fp-help=<text> - Factorio print (RCON-only alias, preserves achievements)
fpo-help=<json> - Translation sink (chat + per-viewer overhead), RCON-only
trust-now=[trust] __1__ is now trusted.
untrust-now=[untrust] __1__ is no longer trusted.
err-admin-only=[__1__] Only admins can use this command.
err-trusted-only=[__1__] Only trusted players or admins can use this command.
err-missing-param=[__1__] Missing required parameter: __2__
err-player-not-found=[__1__] Player not found: __2__
err-not-number=[__1__] Parameter __2__ must be a number, got: __3__
news-help=- Show the welcome screen with server news (RCON: reset status for everyone)
jail-help=<player> [reason] - Jail player: move to the no-permissions group (admin or RCON)
unjail-help=<player> - Remove player from jail, back to Default permissions (admin or RCON)
jail-unknown-player=[jail] NOT applied: player __1__ has never been on this server — check the nickname.
jail-already-jailed=[jail] __1__ is already jailed — nothing changed.
unjail-not-jailed=[unjail] __1__ is not jailed — nothing changed (check the nickname).

; --- Debug/admin commands (/sessions*) — dev-facing → English; pl values identical ---
sessionsthreshold-help=<minutes> - Override GLOBAL auto-trust threshold for testing; 0 = restore default 3h (admin-only)
sessionslocalthreshold-help=<minutes> - Override LOCAL (this map) trust threshold for testing; 0 = restore default 1h (admin-only)
sessionsstatus-help=[player] - Show sessions state (global if no player) (admin-only)
threshold-minutes=__1__ minutes
threshold-minutes-hours=__1__ minutes (__2__ hours)
sessionsthreshold-result=[sessionsthreshold] __1__ → __2__
sessionslocalthreshold-result=[sessionslocalthreshold] __1__ → __2__
sessionsstatus-player=[sessionsstatus] __1__: online_time=__2__ ticks (__3__ min), sessions=__4__ ticks (__5__ min), online_track=__6__, trusted=__7__, manually_untrusted=__8__, trusted_local=__9__, local_baseline=__10__ ticks
sessionsstatus-global=[sessionsstatus] threshold=__1__, sessions=__2__ entries, trusted=__3__ players, online_track=__4__ entries, local_threshold=__5__, trusted_local=__6__ players

; --- /spawnlogo (admin / RCON, diagnostyka spawn-logo) — dev-facing → English; pl values identical ---
spawnlogo-help=[render_layer|reset] - Force-redraw the spawn sign on every planet and report status; optional render-layer override for in-game tuning (admin-only)
spawnlogo-layer-set=[spawnlogo] render layer override set to "__1__" (constants: "__2__"); /spawnlogo reset clears it
spawnlogo-layer-reset=[spawnlogo] render layer override cleared, back to constants ("__1__")
spawnlogo-layer-invalid=[spawnlogo] unknown render layer "__1__"; use a RenderLayer name (e.g. floor, object, higher-object-above) or a number 0-255
spawnlogo-layer-rejected=[spawnlogo] the engine rejected render layer "__1__" on this Factorio version; override reverted
